name: Tester et déployer Shuffle+

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-build:
    name: Vérification complète
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v7

      - name: Installer Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Installer les dépendances Node
        run: npm ci

      - name: Tester et construire Shuffle+
        run: npm run validate

      - name: Installer Chromium et WebKit
        run: npx playwright install --with-deps chromium webkit

      - name: Tester Shuffle+ dans les navigateurs
        run: npm run test:e2e

      - name: Conserver le rapport Playwright en cas d’échec
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: shuffleplus-playwright-report
          path: playwright-report
          if-no-files-found: ignore
          retention-days: 7

      - name: Configurer GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Préparer l’artefact GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    name: Déploiement GitHub Pages
    if: github.event_name != 'pull_request'
    needs: validate-and-build
    runs-on: ubuntu-latest

    permissions:
      actions: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Publier Shuffle+
        id: deployment
        uses: actions/deploy-pages@v5
