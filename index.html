<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Shuffle+ — une meilleure façon de mélanger tes playlists Spotify."
    >

    <title>Shuffle+</title>

    <link rel="stylesheet" href="./style.css">
</head>

<body>
    <main class="app">
        <header class="hero">
            <div class="brand">
                <span class="brand-icon" aria-hidden="true">
                    🎵
                </span>

                <h1>Shuffle+</h1>
            </div>

            <p class="version"></p>

            <h2 id="welcome">
                Bienvenue Matthieu !👋
            </h2>

            <div class="actions">
                <button
                    id="loginButton"
                    class="primary-button"
                    type="button"
                >
                    Se connecter à Spotify
                </button>

                <button
                    id="logoutButton"
                    class="secondary-button"
                    type="button"
                    hidden
                >
                    Se déconnecter
                </button>
            </div>

            <p
                id="status"
                class="status"
                aria-live="polite"
            ></p>
        </header>

        <div id="content"></div>
    </main>

    <script type="module" src="./app.js?v=3.7.0"></script>
</body>
</html>
