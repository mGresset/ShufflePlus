<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Shuffle+ — mix intelligent, Adaptive DJ et automatisation Spotify."
    >

    <meta name="theme-color" content="#8b5cf6">
    <meta name="color-scheme" content="dark">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta
        name="apple-mobile-web-app-status-bar-style"
        content="black-translucent"
    >
    <meta
        name="apple-mobile-web-app-title"
        content="Shuffle+"
    >

    <title>Shuffle+</title>

    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="icon" href="./favicon.ico" sizes="any">
    <link
        rel="icon"
        type="image/png"
        sizes="192x192"
        href="./icons/icon-192.png"
    >
    <link
        rel="apple-touch-icon"
        sizes="180x180"
        href="./icons/apple-touch-icon-180.png"
    >
    <link rel="stylesheet" href="./style.css?v=6.2.0">
</head>

<body>
    <div
        id="networkBanner"
        class="network-banner"
        role="status"
        aria-live="polite"
        hidden
    >
        Mode hors connexion : l’interface reste disponible, mais Spotify nécessite Internet.
    </div>

    <main class="app">
        <header class="hero">
            <div class="brand">
                <span class="brand-icon" aria-hidden="true">
                    🎵
                </span>

                <h1>Shuffle+</h1>
            </div>

            <p class="version"></p>

            <h2 id="welcome">
                Bienvenue Matthieu !👋
            </h2>

            <div class="actions">
                <button
                    id="loginButton"
                    class="primary-button"
                    type="button"
                >
                    Se connecter à Spotify
                </button>

                <button
                    id="logoutButton"
                    class="secondary-button"
                    type="button"
                    hidden
                >
                    Se déconnecter
                </button>

                <button
                    id="installAppButton"
                    class="secondary-button pwa-install-header-button"
                    type="button"
                    hidden
                >
                    ⬇ Installer l’application
                </button>
            </div>

            <p
                id="status"
                class="status"
                aria-live="polite"
            ></p>
        </header>

        <aside
            id="pwaInstallGuide"
            class="pwa-install-guide"
            aria-live="polite"
            hidden
        ></aside>

        <div id="content"></div>
    </main>

    <aside
        id="pwaUpdateBanner"
        class="pwa-update-banner"
        aria-live="polite"
        hidden
    >
        <div>
            <strong>Une mise à jour de Shuffle+ est prête.</strong>
            <span>Recharge l’application pour l’activer.</span>
        </div>
        <div class="pwa-update-actions">
            <button id="applyPwaUpdateButton" type="button">
                Mettre à jour
            </button>
            <button id="dismissPwaUpdateButton" type="button">
                Plus tard
            </button>
        </div>
    </aside>

    <script type="module" src="./app.js?v=6.2.0"></script>
</body>
</html>
